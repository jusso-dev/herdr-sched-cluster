# This is upstream herdr-sched's CI workflow, kept here rather than in
# .github/workflows because the token used to publish this repository did not
# have GitHub's `workflow` scope, and GitHub refuses a push that adds a
# workflow file without it. To turn CI on, either:
#
#   gh auth refresh -h github.com -s workflow
#   mkdir -p .github/workflows && git mv docs/ci/ci.yml .github/workflows/ci.yml
#   git commit -m "ci: enable workflow" && git push
#
# or create .github/workflows/ci.yml with this content in the GitHub web UI.
# The macos-latest job would also run the macOS resource collector on real
# Apple silicon, which this repository has not otherwise done.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run proves nothing about the commit that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing should not hide the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # No real herdr or sibling plugin here: the gate's process-spawning
      # cases answer their calls with fakes on PATH. Running against the real
      # ones is a release concern, not a per-push one.
      - name: Gate
        run: make test-full

  vet:
    name: format and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt needed: $unformatted"; exit 1; }
      - run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
